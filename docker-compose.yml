# ContentBase Docker Compose Configuration
# For development on mini-PC (10.66.66.12) with existing Docker Compose and Ollama

# Version
version: '3.8'

# Services
services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: contentbase-qdrant
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Langfuse Stack (optional, add in Phase 3)
